[project]
name = "{{ cookiecutter.project_name }}"
version = "0.1"
requires-python = "==3.14.*"  # Keep in sync with the Dockerfile
dependencies = [
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "C901"]

[tool.zest-releaser]
release = false

[tool.pyright]
# Out-of-the-box vscode support, provided you created .venv as mentioned in the readme.
venvPath = "."
venv = ".venv"
include = "."

[dependency-groups]
dev = []
